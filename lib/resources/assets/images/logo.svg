<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="hex-grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0288D1"/>
            <stop offset="100%" style="stop-color:#00ACC1"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- 六边形背景 -->
    <polygon points="100,30 170,65 170,135 100,170 30,135 30,65" fill="url(#hex-grad-teal)"/>
    <!-- 装饰六边形 -->
    <polygon points="100,45 155,72 155,125 100,152 45,125 45,72" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- WiFi图标 -->
    <g filter="url(#glow)">
        <circle cx="100" cy="125" r="8" fill="white"/>
        <path d="M75,100 C75,80 85,65 100,65 C115,65 125,80 125,100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <path d="M60,85 C60,60 80,45 100,45 C120,45 140,60 140,85" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- 数据线条装饰 -->
    <line x1="30" y1="100" x2="60" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="140" y1="100" x2="170" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="100" y1="30" x2="100" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="100" y1="140" x2="100" y2="170" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
</svg> 